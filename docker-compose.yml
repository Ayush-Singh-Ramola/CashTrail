services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-money_autopsy}
      POSTGRES_USER: ${POSTGRES_USER:-money_autopsy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-money_autopsy}:${POSTGRES_PASSWORD:-local-development-password}@db:5432/${POSTGRES_DB:-money_autopsy}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-local-compose-secret-change-before-deployment}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-money_autopsy}:${POSTGRES_PASSWORD:-local-development-password}@db:5432/${POSTGRES_DB:-money_autopsy}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-local-compose-secret-change-before-deployment}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
